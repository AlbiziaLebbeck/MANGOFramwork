apiVersion: apps/v1
kind: Deployment
metadata: { name: ttb-backup-metrics, namespace: ttb-uat }
spec:
  replicas: 1
  strategy: { type: Recreate }
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: ttb-backup-metrics } }
  template:
    metadata:
      labels: { app: ttb-backup-metrics, app.kubernetes.io/part-of: ttb-commerce }
      annotations: { mangosgo.com/ttb-observer-source-sha256: __SOURCE_SHA256__ }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: observer
          image: mcr.microsoft.com/playwright:v1.63.0-noble
          command: [python3, '-B', /observer/backup-metrics.py]
          env:
            - { name: TTB_BACKUP_ENVIRONMENT, value: Uat }
            - name: TTB_RECIPIENT_SHA256
              valueFrom: { configMapKeyRef: { name: ttb-backup-recipient, key: sha256 } }
            - name: Operations__MetricsToken
              valueFrom: { secretKeyRef: { name: ttb-operations, key: Operations__MetricsToken } }
          ports: [{ name: metrics, containerPort: 8081 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /health/live, port: metrics }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: metrics }, initialDelaySeconds: 15, periodSeconds: 15 }
          volumeMounts:
            - { name: observer, mountPath: /observer, readOnly: true }
            - { name: backups, mountPath: /backups, readOnly: true }
            - { name: recipient, mountPath: /recipient, readOnly: true }
      volumes:
        - { name: observer, configMap: { name: ttb-backup-observer, defaultMode: 0444 } }
        - { name: backups, persistentVolumeClaim: { claimName: ttb-encrypted-backups, readOnly: true } }
        - { name: recipient, configMap: { name: ttb-backup-recipient, defaultMode: 0444, items: [{ key: recipient.pem, path: recipient.pem }] } }
---
apiVersion: v1
kind: Service
metadata: { name: ttb-backup-metrics, namespace: ttb-uat }
spec:
  type: ClusterIP
  selector: { app: ttb-backup-metrics }
  ports: [{ name: metrics, port: 8081, targetPort: metrics }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ttb-backup-observer-isolation, namespace: ttb-uat }
spec:
  podSelector: { matchLabels: { app: ttb-backup-metrics } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: ttb-prometheus } } }]
      ports: [{ protocol: TCP, port: 8081 }]
  egress: []
