apiVersion: v1
kind: Service
metadata: { name: ttb-commerce-metrics, namespace: ttb-uat }
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector: { app: ttb-commerce-api }
  ports: [{ name: metrics, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ttb-prometheus-data, namespace: ttb-uat }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ttb-prometheus, namespace: ttb-uat }
spec:
  replicas: 1
  strategy: { type: Recreate }
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: ttb-prometheus } }
  template:
    metadata:
      labels: { app: ttb-prometheus, app.kubernetes.io/part-of: ttb-commerce }
      annotations: { mangosgo.com/ttb-monitoring-config-sha256: __CONFIG_SHA256__ }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, runAsNonRoot: true }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=512MB
            - --web.listen-address=0.0.0.0:9090
          ports: [{ name: http, containerPort: 9090 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: '1', memory: 512Mi, ephemeral-storage: 128Mi } }
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /-/healthy, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: token, mountPath: /run/ttb-metrics, readOnly: true }
            - { name: data, mountPath: /prometheus }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: ttb-prometheus-config, defaultMode: 0444 } }
        - name: token
          secret:
            secretName: ttb-operations
            defaultMode: 0440
            items: [{ key: Operations__MetricsToken, path: token }]
        - { name: data, persistentVolumeClaim: { claimName: ttb-prometheus-data } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ttb-prometheus, namespace: ttb-uat }
spec:
  type: ClusterIP
  selector: { app: ttb-prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ttb-prometheus-isolation, namespace: ttb-uat }
spec:
  podSelector: { matchLabels: { app: ttb-prometheus } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/part-of: ttb-commerce } } }]
      ports: [{ protocol: TCP, port: 9090 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: ttb-tls-metrics } } }]
      ports: [{ protocol: TCP, port: 8081 }]
    - to: [{ podSelector: { matchLabels: { app: ttb-backup-metrics } } }]
      ports: [{ protocol: TCP, port: 8081 }]
    - to: [{ podSelector: { matchLabels: { app: ttb-commerce-api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
