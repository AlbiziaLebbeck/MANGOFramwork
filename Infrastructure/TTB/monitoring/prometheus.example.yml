global:
  scrape_interval: 60s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ttb-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/ttb-metrics/token
    static_configs:
      - targets: [ttb-commerce-api.ttb-uat.svc.cluster.local:8080]
        labels: { environment: Uat }
# This base configuration has no external receiver.
# provision-monitoring.ps1 adds the optional backup/TLS jobs only after their scoped private observers exist.
# On-call receiver approval/testing is a separate gate; a private dashboard is not delivered notification.
