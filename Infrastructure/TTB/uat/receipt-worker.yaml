apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttb-receipt-worker
  namespace: ttb-uat
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: ttb-receipt-worker }
  template:
    metadata:
      labels: { app: ttb-receipt-worker, app.kubernetes.io/part-of: ttb-commerce }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: worker
          image: mcr.microsoft.com/playwright:v1.63.0-noble
          workingDir: /app
          command: [/app/TtbCommerce.Api]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Uat }
            - { name: Commerce__Role, value: ReceiptWorker }
            - { name: ASPNETCORE_URLS, value: 'http://0.0.0.0:8080' }
            - { name: DOTNET_EnableDiagnostics, value: '0' }
            - { name: HOME, value: /tmp }
            - { name: PLAYWRIGHT_BROWSERS_PATH, value: /ms-playwright }
          envFrom:
            - secretRef: { name: ttb-operations, optional: true }
            - secretRef: { name: ttb-commerce-runtime }
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: '2', memory: 1536Mi }
          startupProbe:
            httpGet: { path: /health/live, port: http, httpHeaders: [{ name: Host, value: localhost }] }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /health/ready, port: http, httpHeaders: [{ name: Host, value: localhost }] }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http, httpHeaders: [{ name: Host, value: localhost }] }
            periodSeconds: 15
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: temporary, mountPath: /tmp }
            - { name: private, mountPath: /var/ttb-private }
      volumes:
        - name: app
          hostPath:
            path: /opt/ttb-commerce/uat/releases/__RELEASE__/api
            type: Directory
        - name: temporary
          emptyDir: { sizeLimit: 512Mi }
        - name: private
          persistentVolumeClaim: { claimName: ttb-private }

---
# Rendering is offline. This worker can reach only its own database and cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ttb-receipt-worker-isolation
  namespace: ttb-uat
spec:
  podSelector:
    matchLabels: { app: ttb-receipt-worker }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: { app: ttb-postgres }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]

