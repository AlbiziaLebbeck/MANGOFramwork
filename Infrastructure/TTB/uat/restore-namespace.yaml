apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels: { app.kubernetes.io/part-of: ttb-restore-drill, mangosgo.com/ttb-restore-id: __DRILL_ID__ }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-all, namespace: __NAMESPACE__ }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: __NAMESPACE__
  labels: { app: ttb-restore-postgres, mangosgo.com/ttb-restore-id: __DRILL_ID__ }
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: { runAsUser: 70, runAsGroup: 70, fsGroup: 70, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: postgres
      image: postgres:18-alpine
      command: [docker-entrypoint.sh]
      args: [postgres, '-c', 'listen_addresses=']
      env:
        - { name: POSTGRES_USER, value: ttb_restore }
        - { name: POSTGRES_DB, value: ttb_restore }
        # No TCP listener/service/ingress; Unix-socket access is available only through the authorized exec session.
        - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      resources: { requests: { cpu: 50m, memory: 128Mi, ephemeral-storage: 256Mi }, limits: { cpu: '1', memory: 1Gi, ephemeral-storage: 10Gi } }
      readinessProbe:
        exec: { command: [pg_isready, '-h', /var/run/postgresql, '-U', ttb_restore, '-d', ttb_restore] }
        initialDelaySeconds: 3
        periodSeconds: 3
      volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql }
        - { name: socket, mountPath: /var/run/postgresql }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - { name: data, emptyDir: { sizeLimit: 8Gi } }
    - { name: socket, emptyDir: { sizeLimit: 16Mi } }
    - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
