apiVersion: batch/v1
kind: Job
metadata:
  name: ttb-migrate-__RELEASE__
  namespace: ttb-uat
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: ttb-commerce }
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: migrate
          image: mcr.microsoft.com/playwright:v1.63.0-noble
          workingDir: /app
          command: [/app/TtbCommerce.Api, --migrate]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Uat }
            - { name: DOTNET_EnableDiagnostics, value: '0' }
            - name: ConnectionStrings__Commerce
              valueFrom:
                secretKeyRef: { name: ttb-database-owner, key: connection }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: app
          hostPath:
            path: /opt/ttb-commerce/uat/releases/__RELEASE__/api
            type: Directory
        - name: temporary
          emptyDir: { sizeLimit: 128Mi }
